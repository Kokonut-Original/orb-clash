
<canvas id="aurora" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<div id="loader" aria-hidden="true">
  <div class="idx">(000) — Orb Clash</div>
  <div class="ld-num"><span id="ldn">000</span><span>%</span></div>
  <div class="ld-bar"><i id="ldb"></i></div>
  <div class="ld-cap"><span class="idx" id="ldt">Đang dựng 9 sàn đấu…</span><span class="idx">Đấu offline với bot</span></div>
</div>

<div class="cursor" id="cursor" aria-hidden="true"><i class="c-ring"></i><i class="c-dot"></i></div>

<div class="app" id="app">
  <header class="top">
    <div class="logo"><span class="o" aria-hidden="true"></span>ORB<em>CLASH</em></div>
    <div class="wallet">
      <span class="chip-cur" id="coinChip" title="Xu"><span class="coin"></span><span id="coins">0</span></span>
      <span class="chip-cur" id="gemChip" title="Gems"><span class="gem"></span><span id="gems">0</span></span>
      <button class="icon-btn" id="gfxBtn" aria-label="Cài đặt đồ hoạ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button>
      <button class="icon-btn" id="muteBtn" aria-label="Bật hoặc tắt âm thanh"></button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="play" aria-selected="true"><small>01</small>Đấu</button>
    <button class="tab" role="tab" data-tab="collection" aria-selected="false"><small>02</small>Bộ sưu tập</button>
    <button class="tab" role="tab" data-tab="crates" aria-selected="false"><small>03</small>Rương</button>
    <button class="tab" role="tab" data-tab="codes" aria-selected="false"><small>04</small>Code</button>
    <button class="tab" role="tab" data-tab="merge" aria-selected="false"><small>05</small>Hợp thể</button>
  </nav>
  <main id="main"></main>
</div>

<div class="match" id="match" hidden>
  <div class="m-in">
    <div class="fighters">
      <div class="ft" id="fP">
        <span class="combo">COMBO</span>
        <span class="orb"><span></span></span>
        <div class="who"><b>Bạn</b><small></small></div>
        <div class="hp"><em></em><i></i><s></s></div>
        <div class="meta"><span class="abn"><span class="cdr"></span><span class="abt"></span></span><span class="hpt"></span></div>
      </div>
      <div class="mid">
        <span class="timer" id="timer">0:45</span>
        <span class="pips" id="pips"></span>
      </div>
      <div class="ft bot" id="fB">
        <span class="combo">COMBO</span>
        <span class="orb"><span></span></span>
        <div class="who"><b>Bot</b><small></small></div>
        <div class="hp"><em></em><i></i><s></s></div>
        <div class="meta"><span class="hpt"></span><span class="abn"><span class="abt"></span><span class="cdr"></span></span></div>
      </div>
    </div>
    <div class="stage" id="stage"><canvas id="arena" aria-label="Sàn đấu"></canvas>
      <div class="bossbar" id="bossBar" hidden><div class="bb-n"><b>BOSS</b><small></small></div><div class="bb-hp"><em></em><i></i><span class="bb-mk"></span></div></div>
      <span class="fps" id="fps" hidden>— FPS</span>
      <span class="taphint">Chạm sàn để Dồn lực</span></div>
    <div class="ctrl">
      <button class="btn od mag" id="odBtn">DỒN LỰC <kbd>Space</kbd></button>
      <button class="btn btn-ghost mag" id="speedBtn">Tốc độ 1×</button>
      <button class="btn btn-ghost mag" id="quitBtn">Đầu hàng</button>
      <button class="icon-btn" id="gfxBtn2" aria-label="Cài đặt đồ hoạ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button>
    </div>
  </div>
</div>

<div id="layer"></div>
<canvas id="fxc" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status"></div>
