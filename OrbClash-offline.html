const TOWER_N=25;
const TOWER_POOLS=[["common","rare"],["rare","epic"],["epic","legendary"],["legendary","mythic"],["mythic","legendary"]];
function towerFloor(f){
  const boss=BOSSES.find(b=>b.floor===f);if(boss)return{type:"boss",boss,arena:boss.arena,lv:1};
  const tier=Math.floor((f-1)/5),inTier=(f-1)%5,lv=clamp(1+tier*2+(inTier>=2?1:0),1,MAX_LV);
  const type=inTier===2?"horde":inTier===3&&f>5?"elite":"duel";
  const nonBoss=ARENA_IDS.filter(id=>!BOSSES.some(b=>b.arena===id&&b.floor===f));
  return{type,lv,pool:TOWER_POOLS[Math.min(4,tier)],arena:type==="horde"?pick(["desert","temple"]):nonBoss[(f*5+tier*3)%nonBoss.length],n:8+tier*2};
}
function towerRun(){if(!S.tower.run)S.tower.run={floor:Math.max(1,S.tower.ckpt||1),hearts:3};return S.tower.run}
function openTower(){
  const run=towerRun(),f=run.floor;
  const rows=[];for(let k=TOWER_N;k>=1;k--){const info=towerFloor(k),cur=k===f,done=k<f||k<=S.tower.best&&k<f,b=info.boss;
    rows.push(`<div class="fl ${b?"boss":""} ${cur?"cur":""} ${k<f?"done":""} ${k>f?"lock":""}" style="--fc:${b?b.color:ARENA_BY[info.arena].neon}"><span class="fn">${String(k).padStart(2,"0")}</span>
      <span class="ft-n">${b?`<b>${b.name.toUpperCase()}</b><small>${b.title}</small>`:`<b>${info.type==="horde"?"Bầy lính cát":info.type==="elite"?"Song đấu tinh nhuệ":"Đấu tay đôi"}</b><small>${ARENA_BY[info.arena].name} · bot LV ${info.lv}</small>`}</span>
      <span class="fs">${k<f?"✓":cur?"⟵":b?"BOSS":k%5===0?"":""}</span></div>`)}
  const next=BOSSES.find(b=>b.floor>=f)||BOSSES[BOSSES.length-1];
  $("#layer").innerHTML=`<div class="overlay"><div class="tower">

function copiesOf(id){return S.owned[id]?Math.max(1,S.copies[id]||1):0}
function removeCopy(id){const n=copiesOf(id)-1;if(n<=0){delete S.owned[id];delete S.copies[id]}else S.copies[id]=n}
/** Nhận 1 bản bóng: bản mới, hoặc +1 bản và +1 cấp nếu đã có. */
function grantBall(id){
  const before=S.owned[id]||0;S.copies[id]=(before?copiesOf(id):0)+1;
  if(!before){S.owned[id]=1;return{type:"new",copies:1}}
  if(before<MAX_LV){S.owned[id]=before+1;return{type:"up",from:before,to:before+1,copies:S.copies[id]}}
  return{type:"max",copies:S.copies[id]};
}

/* — nền thiên hà — */
let galRaf=0;
function stopGalaxy(){if(galRaf){cancelAnimationFrame(galRaf);galRaf=0}}
function startGalaxy(c){
  const g=c.getContext("2d");let w=0,h=0,stars=[],shoot=null;
  const fit=()=>{const r=c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0);
    const R=srng(42);stars=Array.from({length:Math.round(w*h/2600)},()=>({x:R()*w,y:R()*h,s:R()*1.4+.2,p:R()*TAU,v:R()*2+.5,c:R()<.15?"#C3AEFF":R()<.1?"#9FD8FF":"#FFFFFF"}))};
  fit();const ro=new ResizeObserver(fit);ro.observe(c);
  (function f(ts){galRaf=requestAnimationFrame(f);if(!c.isConnected){ro.disconnect();stopGalaxy();return}const t=ts/1000;
    const bg=g.createLinearGradient(0,0,w,h);bg.addColorStop(0,"#05030D");bg.addColorStop(.5,"#0A0620");bg.addColorStop(1,"#030208");g.fillStyle=bg;g.fillRect(0,0,w,h);
    g.globalCompositeOperation="lighter";
    for(const [x,y,r,col] of [[.25+Math.sin(t*.05)*.05,.3,.55,"rgba(107,75,255,.16)"],[.78,.62+Math.cos(t*.04)*.05,.5,"rgba(255,77,170,.10)"],[.55,.12,.35,"rgba(54,180,255,.08)"],[.15,.85,.4,"rgba(140,90,255,.10)"]]){const gr=g.createRadialGradient(x*w,y*h,0,x*w,y*h,r*Math.max(w,h));gr.addColorStop(0,col);gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.fillRect(0,0,w,h)}
    // dải ngân hà
    g.save();g.translate(w/2,h/2);g.rotate(-.35);const band=g.createLinearGradient(0,-h*.18,0,h*.18);band.addColorStop(0,"rgba(255,255,255,0)");band.addColorStop(.5,"rgba(200,190,255,.06)");band.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=band;g.fillRect(-w,-h*.18,w*2,h*.36);g.restore();
    for(const s of stars){const a=.35+.65*Math.abs(Math.sin(t*s.v+s.p));g.globalAlpha=a;g.fillStyle=s.c;g.beginPath();g.arc(s.x,s.y,s.s,0,TAU);g.fill();if(s.s>1.3){g.globalAlpha=a*.35;g.fillRect(s.x-s.s*3,s.y-.4,s.s*6,.8);g.fillRect(s.x-.4,s.y-s.s*3,.8,s.s*6)}}
    g.globalAlpha=1;
    if(!shoot&&Math.random()<.006)shoot={x:Math.random()*w,y:Math.random()*h*.4,vx:-(300+Math.random()*300),vy:150+Math.random()*120,l:1};
    if(shoot){shoot.x+=shoot.vx/60;shoot.y+=shoot.vy/60;shoot.l-=1/50;const gr=g.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*.18,shoot.y-shoot.vy*.18);gr.addColorStop(0,`rgba(255,255,255,${shoot.l})`);gr.addColorStop(1,"rgba(255,255,255,0)");g.strokeStyle=gr;g.lineWidth=1.6;g.beginPath();g.moveTo(shoot.x,shoot.y);g.lineTo(shoot.x-shoot.vx*.18,shoot.y-shoot.vy*.18);g.stroke();if(shoot.l<=0)shoot=null}
    g.globalCompositeOperation="source-over";
  })(performance.now());
}

function mgPick(id){

  if(id===MG.b){MG.b=null;sfx.click();return renderMergeParts()}
  if(b.rar==="mythic"){toast("Thần thoại là bậc cao nhất, không hợp thể được.");return}
  if(MG.a&&BY_ID[MG.a].rar!==b.rar){toast(`Chỉ ghép được 2 bóng cùng độ hiếm ${RAR_VN[BY_ID[MG.a].rar]}.`);return}
  if(!MG.a)MG.a=id;else MG.b=id;
  sfx.click();renderMergeParts();
}
function doMerge(){
  const A=BY_ID[MG.a],B=BY_ID[MG.b];if(!A||!B||A.id===B.id||A.rar!==B.rar)return;
  const M=MERGE[A.rar];if(!M||S.gems<M.cost)return;
  S.gems-=M.cost;const x=Math.random()*100;let res;
  if(x<M.ok){removeCopy(A.id);removeCopy(B.id);const nb=pick(BALLS.filter(b=>b.rar===nextRar(A.rar)));res={type:"ok",ball:nb,out:grantBall(nb.id)}}
  else if(x<M.ok+M.fail){const lost=Math.random()<.5?A:B;removeCopy(lost.id);res={type:"fail",lost,kept:lost===A?B:A}}
  else{removeCopy(A.id);removeCopy(B.id);res={type:"brk"}}

  const b=b32dec(s);if(!b||b.length<13)return null;const sig=b.slice(10,13),mk=giftMask(sig),p=b.slice(0,10).map((v,i)=>v^mk[i]);

  const bi=p[4];return{coins:((p[0]<<8)|p[1])*10,gems:(p[2]<<8)|p[3],ball:bi?BALLS[bi-1]&&BALLS[bi-1].id:null,serial:(p[5]<<16)|(p[6]<<8)|p[7],expDays:(p[8]<<8)|p[9]};
}
/* ───────── Mã màn tuỳ chỉnh ───────── */
function levelCode(L){const j=JSON.stringify(L),b=btoa(unescape(encodeURIComponent(j))).replace(/=+$/,"");return"OCL-"+b+"."+sha256(GIFT_KEY+"|L|"+j).slice(0,10)}
function readLevel(raw){const s=String(raw||"").trim();if(!s.startsWith("OCL-"))return null;const [b,sig]=s.slice(4).split(".");try{const j=decodeURIComponent(escape(atob(b)));if(sha256(GIFT_KEY+"|L|"+j).slice(0,10)!==sig)return{bad:true};return JSON.parse(j)}catch(e){return{bad:true}}}
/** Gọi từ ô nhập code: xử lý code quà ký số và mã màn. Trả true nếu đã xử lý. */
function tryRedeemSpecial(raw,msg){
  const L=readLevel(raw);
  if(L){if(L.bad){msg.className="msg err";msg.textContent="Mã màn bị hỏng hoặc bị sửa.";return true}
    S.levels=S.levels||[];if(S.levels.some(x=>x.id===L.id)){msg.className="msg err";msg.textContent="Bạn đã có màn này rồi.";return true}
    S.levels.push(L);save();sfx.coin();msg.className="msg ok";msg.textContent=`Đã thêm màn "${L.name}". Xem ở tab Đấu, mục Màn tuỳ chỉnh.`;return true}
  const g=readGift(raw);if(!g)return false;
  if(g.bad){msg.className="msg err";msg.textContent="Mã sai chữ ký. Kiểm tra lại từng ký tự.";return true}
  const key="#"+g.serial;
  if(S.codes.includes(key)){msg.className="msg err";msg.textContent=`Mã #${String(g.serial).padStart(6,"0")} đã được dùng trên máy này.`;return true}
  if(g.expDays&&Date.now()>EPOCH+g.expDays*864e5){msg.className="msg err";msg.textContent="Mã đã hết hạn.";return true}
  S.codes.push(key);S.coins+=g.coins;S.gems+=g.gems;let bl="";if(g.ball){grantBall(g.ball);bl=` và bóng ${BY_ID[g.ball].name}`}
  save();updateWallet();sfx.coin();flashbang("#FFC23D");const r=$("#codeInput").getBoundingClientRect();confettiBurst(r.left+r.width/2,r.top,120,["#FFC23D","#36E2FF","#FF4D7A"]);
  renderTab();const m2=$("#codeMsg");m2.className="msg ok";m2.textContent=`Mã quà #${String(g.serial).padStart(6,"0")}: nhận ${[g.coins?fmt(g.coins)+" xu":"",g.gems?g.gems+" Gems":""].filter(Boolean).join(", ")}${bl}.`;return true;
}

/* ───────── Tỉ lệ game (lưu trên máy này) ───────── */
const TUNE_DEF=JSON.parse(JSON.stringify({crates:Object.fromEntries(Object.entries(CRATES).map(([k,c])=>[k,{rates:c.rates,pn:c.pity.n,cost:c.cost}])),merge:MERGE,box:{every:10,trap:15,life:15},rew:{coin:1,gem:1}}));
let TUNEX={coin:1,gem:1};
function applyTune(){
  const t=Object.assign(JSON.parse(JSON.stringify(TUNE_DEF)),S.tune||{});
  for(const [k,c] of Object.entries(t.crates)){if(!CRATES[k])continue;CRATES[k].rates=Object.assign({},c.rates);CRATES[k].pity.n=c.pn;CRATES[k].cost=c.cost}
  for(const [r,m] of Object.entries(t.merge))if(MERGE[r])Object.assign(MERGE[r],m);
  BOX_EVERY=t.box.every;BOX_TRAP=t.box.trap/100;BOX_LIFE=t.box.life;TUNEX=t.rew;
}
applyTune();

function levelCfg(L,pDef,pLv){
  const cfg={pDef,pLv,arena:L.arena,ot:L.ot,label:(L.name||"SÂN TẬP").toUpperCase().slice(0,18)};let eDef=BY_ID[L.enemy]||pick(BALLS);let setup=null;
  if(L.type==="boss"){eDef=BOSS_BY[L.enemy]||BOSSES[0];setup=setupBoss(eDef,L.hpMul);cfg.eName=eDef.name}
  else if(L.type==="horde"){setup=setupHorde(L.count,L.lv,k=>k%4===3?"archer":null);cfg.eName=`Lính cát ×${L.count}`}
  else if(L.type==="swarm"){setup=setupHorde(L.count,L.lv,k=>k%3===2?null:"boomer");cfg.eName=`Bầy chuột ×${L.count}`}
  else if(L.type==="elite"){const d2=pick(BALLS.filter(b=>b.rar===eDef.rar&&b.id!==eDef.id));setup=setupElite(d2,L.lv);cfg.eName="Bộ đôi"}
  else if(L.type==="giant"){setup=setupGiant();cfg.eName="Khổng lồ"}
  else if(L.type==="mirror"){eDef=pDef;setup=setupMirror();cfg.eName="Bóng gương"}
  cfg.eDef=eDef;cfg.eLv=L.type==="boss"?1:L.lv;
  cfg.setup=g=>{if(setup)setup(g);if(L.type!=="boss"&&L.hpMul!==1)for(const o of g.balls)if(o.side===1){o.max*=L.hpMul;o.hp=o.max}if(g.horde)g.hordeMax=g.balls.filter(o=>o.side===1).reduce((s,u)=>s+u.max,0);g.noBox=!L.boxes};
  return cfg;
}

function renderDbgBar(){

  bar.querySelectorAll("[data-db]").forEach(b=>b.onclick=e=>{e.stopPropagation();const k=b.dataset.db;if(!G)return;
    if(k==="ko"){for(const o of G.balls)if(o.side===1&&o.alive&&o.kind!=="head")deal(null,o,99999,{})}

function drawHitboxes(){
  if(!DBG.hit||!G)return;ctx.save();ctx.lineWidth=1;
  for(const b of G.balls){if(!b.alive)continue;ctx.strokeStyle=b.side?"#FF4D7A":"#36E2FF";circle(b.x,b.y,b.r);ctx.stroke();ctx.fillStyle=ctx.strokeStyle;ctx.fillRect(b.x-1.5,b.y-1.5,3,3);ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+b.vx*.15,b.y+b.vy*.15);ctx.stroke()}
  ctx.strokeStyle="#FFE14F";for(const p of G.proj){circle(p.x,p.y,p.r);ctx.stroke()}for(const bx of G.boxes||[]){circle(bx.x,bx.y,bx.r);ctx.stroke()}
  ctx.strokeStyle="#5CF2A8";for(const z of G.zones){circle(z.x,z.y,z.r);ctx.stroke()}for(const o of (G.as&&G.as.obs)||[]){circle(o.x,o.y,o.r);ctx.stroke()}
  ctx.restore();
}

/* ═════════════════════════════════════════════════════════════
   MÀN TRAO CÚP — bục 2·1·3 hiện trước; hạng 3 và hạng 2 rơi từ trời

function playCeremony(list,done){
  $("#layer").innerHTML=`<div class="fuse-ov cer" id="cerOv"><canvas id="cerC"></canvas><div class="cer-ui" id="cerUI"></div><button class="btn btn-ghost cer-skip" id="cerSkip">Bỏ qua ⟶</button></div>`;
  const c=$("#cerC"),g=c.getContext("2d"),d=Math.min(2,devicePixelRatio||1);let w,h;
  const fit=()=>{w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0)};fit();addEventListener("resize",fit);
  const R=srng(99),stars=Array.from({length:180},()=>({x:R(),y:R()*.7,s:R()*1.3+.2,p:R()*TAU}));
  const MEDAL=[["#FFD54A","#FFF3B0","#B8860B"],["#D9DEE8","#FFFFFF","#8A93A6"],["#E09A5A","#FFD2A6","#8B4A1C"]];
  let t=0,last=performance.now(),parts=[],rockets=[],shake=0,done2=false,cam={z:1,x:0,y:0},flash=0;
  const ev={};const once=(k,fn)=>{if(!ev[k]){ev[k]=1;fn()}};
  // bố cục
  const L=()=>{const u=Math.min(w/3.4,h/4.2,260),cx=w/2,base=h*.82;return{u,cx,base,pod:[{x:cx,hgt:u*1.15},{x:cx-u*1.05,hgt:u*.8},{x:cx+u*1.05,hgt:u*.58}]}};
  const ease=x=>1-Math.pow(1-clamp(x,0,1),3),bounce=x=>{x=clamp(x,0,1);const n=7.5625,d1=2.75;if(x<1/d1)return n*x*x;if(x<2/d1)return n*(x-=1.5/d1)*x+.75;if(x<2.5/d1)return n*(x-=2.25/d1)*x+.9375;return n*(x-=2.625/d1)*x+.984375};
  const burstAt=(x,y,cols,n,sp,grav=0)=>{for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(.2,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.8,1.7),max:1.7,c:pick(cols),s:rand(1.5,3.5),grav})}};
  function trophy(x,y,s,m,label,a=1){
    g.save();g.globalAlpha=a;g.translate(x,y);const [c0,c1,c2]=MEDAL[m];
    g.globalCompositeOperation="lighter";g.drawImage(glowSprite(c0),-s*1.6,-s*2.4,s*3.2,s*3.2);g.globalCompositeOperation="source-over";

/* ═════════════════════════ TOURNAMENT LAN (client) ═════════════════════════
   Server (server/server.js) chạy mô phỏng; client chỉ gửi input và vẽ snapshot (~25 lần/giây, nội suy 100ms).
   Offline vẫn chơi bình thường: mọi thứ ở đây chỉ chạy khi người chơi bấm vào thẻ "Tournament LAN". */
const NET={ws:null,on:false,token:null,me:null,rooms:[],room:null,fight:false,mid:null,side:-1,snaps:[],loc:new Map(),names:["",""],ended:false,ping:0,raf:0,lastT:0,addr:""};
try{NET.token=sessionStorage.getItem("oc.net.token");NET.addr=localStorage.getItem("oc.net.addr")||""}catch(e){}
const netSend=m=>{if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(m))};
const netName=()=>{try{return localStorage.getItem("oc.net.name")||"Người chơi"}catch(e){return"Người chơi"}};

(function(){

    if(!NET.fight)return tb(e);

/* — kết nối — */
function netConnect(addr){
  return new Promise((res,rej)=>{
    let url;try{url=(addr.startsWith("ws")?addr:"ws://"+addr.replace(/^https?:\/\//,"").replace(/\/$/,""))}catch(e){return rej(e)}
    let ws;try{ws=new WebSocket(url)}catch(e){return rej(e)}
    const to=setTimeout(()=>{try{ws.close()}catch(e){}rej(new Error("Hết giờ chờ"))},5000);
    ws.onopen=()=>{clearTimeout(to);NET.ws=ws;NET.on=true;NET.addr=addr;try{localStorage.setItem("oc.net.addr",addr)}catch(e){}netSend({t:"hello",token:NET.token,name:netName()})};
    ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}if(m.t==="welcome"){NET.me=m;NET.token=m.token;try{sessionStorage.setItem("oc.net.token",m.token)}catch(e){}res(m)}netOnMsg(m)};
    ws.onerror=()=>{clearTimeout(to);rej(new Error("Không kết nối được"))};
    ws.onclose=()=>{NET.on=false;NET.ws=null;if(NET.fight){netStopFight();toast("Mất kết nối server")}if($("#netOv"))netView()};
  });
}
function netOnMsg(m){
  switch(m.t){
    case"rooms":NET.rooms=m.rooms;if($("#netOv")&&!NET.room)netView();break;
    case"room":NET.room=m.room;if(!NET.fight&&!$("#pickOv"))netView();break;
    case"left":NET.room=null;netStopFight();netView();break;
    case"err":toast(m.txt);break;
    case"note":toast(m.txt);break;
    case"offer":netPick(m);break;
    case"picked":{const o=$("#pickOv");if(o)o.querySelector(".idx b").textContent="Đã chọn — chờ đối thủ…";break}
    case"mstart":netStart(m);break;
    case"s":if(m.m===NET.mid)netSnap(m);break;
    case"mend":if(m.m===NET.mid)netEnd(m);break;
    case"result":break;
  }
}

    if(lb.alive&&!sn.al)kill(lb);

    lb.owner=sn.ow?NET.loc.get(sn.ow):null;lb.abSrc=sn.mm?BY_ID[sn.mm].ab:null;lb.sc=lvScale(sn.lv);

    lb.spin+=Math.hypot(sn.vx,sn.vy)*.016/Math.max(8,sn.r);

  G.zones=sb.zn.map(z=>({kind:z.kd,x:z.x,y:z.y,r:z.r,life:z.life,t:z.t,c:z.c,arm:z.arm,draw:z.dk?(q,f)=>glowAt(q.x,q.y,q.r*1.2,q.c,.35*f):null}));
  G.lines=sb.ln.map(L=>Object.assign({},L,{fired:!!L.fired,both:!!L.both}));
  G.blasts=sb.bl.map(z=>({kind:z.kd,x:z.x,y:z.y,r:z.r,t:z.t,delay:z.delay,c:z.c,fx:z.fx||z.x,fy:z.fy||z.y-300}));
  G.tethers=sb.te.map(t=>({a:NET.loc.get(t.a),b:NET.loc.get(t.b)})).filter(t=>t.a&&t.b);

/* phát lại hiệu ứng từ server (không gây sát thương: explode truyền dmg=0) */
function netReplay(e){
  const [n,...a]=e,L=x=>x&&typeof x==="object"&&x.u!==undefined?NET.loc.get(x.u):x;
  try{
    if(n==="explode"){explode(a[0],a[1],a[2],0,null,a[5],a[6]||{})}
    else if(n==="impact")impact(...a);
    else if(n==="ring")ring(...a);else if(n==="sparkBurst")sparkBurst(...a);else if(n==="burst")burst(...a);
    else if(n==="ripple")ripple(...a);else if(n==="decal")decal(...a);else if(n==="beam")beam(...a);
    else if(n==="floater"){const b=L(a[0]);if(b)floater(b,a[1],a[2],a[3])}
    else if(n==="castFx"){const b=L(a[0]);if(b)castFx(b)}
    else if(n==="kill"){const b=L(a[0]);if(b&&b.alive)kill(b)}
    else if(n==="overdrive"){const b=L(a[0]);if(b){ring(b.x,b.y,b.r,b.r+90,b.side===0?"#36E2FF":"#FF4D7A",.6,6);ring(b.x,b.y,b.r,b.r+50,"#ffffff",.4,3);
      G.texts.push({x:b.x,y:b.y-b.r-26,txt:"DỒN LỰC!",kind:b.side?"cfoe":"cyou",t:0,big:true});G.speed={x:b.x,y:b.y,t:0};G.chroma=Math.max(G.chroma,.25);G.shake+=8;sfx.whoosh()}}
    else if(n==="openBox"){const box=a[0],b=L(a[1]);if(box&&b){const col=box.trap?"#FF5470":box.c;G.flashes.push({x:box.x,y:box.y,r:90,t:0,dur:.25,c:col});ring(box.x,box.y,8,80,col,.45,5);sparkBurst(box.x,box.y,[col,"#ffffff","#FFE14F"],34,560);sfx.click()}}
  }catch(err){}
}
function netLoop(ts){

/* mô phỏng tức thì một trận bot vs bot (không vẽ, không tiếng) */
function tourSimDuel(dA,dB,arena){
  const mu=S.muted,fx=FXQ,m0=M;S.muted=true;FXQ=FXQ_LV.low;let w=-1;
  try{for(let tries=0;tries<3&&w===-1;tries++){M={mode:"sim",round:1,score:[0,0]};newFight(dA,1,dB,1);setArena(arena);G.count=0;G.watch0=true;G.botOD0=rand(5,15);G.pODn=0;
    let n=0;while(!G.over&&n<120*200){step(DT);n++;if(n%10===0)stepFx(DT*10)}w=G.winner}}
  finally{S.muted=mu;FXQ=fx;M=m0}
  return w===-1?(Math.random()<.5?0:1):w;
}
function tourSimOne(nx){
  const rar=pick(RARS),dA=pick(tourOffers(rar)),dB=pick(tourOffers(rar));
  const w=tourSimDuel(dA,dB,pick(ARENA_IDS));TOUR.last[nx.m.a]=dA;TOUR.last[nx.m.b]=dB;
  tourResult(nx.m,w===0?nx.m.a:nx.m.b);
}

/** chạy 1 trận có hình. watch=true: bot vs bot, người chơi chỉ xem */
function tourFight(nx,dMe,dOpp,opp,watch,pA){
  TOUR.last[watch?pA.id:0]=dMe;TOUR.last[opp.id]=dOpp;
  const cur={mode:"tour",round:1,score:[0,0]};
  cur.onEnd=w=>{if(cur.ended)return;
    if(w===-1){launch();return}
    cur.ended=true;if(raf){cancelAnimationFrame(raf);raf=0}
    $("#match").hidden=true;$("#fP .who b").textContent="Bạn";$("#odBtn").style.display="";auOn=true;
    const winId=w===0?(watch?pA.id:0):opp.id;tourResult(nx.m,winId);
    if(!watch){if(winId===0){sfx.coin();confettiBurst(innerWidth/2,innerHeight*.5,120,["#36E2FF","#FFC23D","#5CF2A8"])}tourBracket(winId===0?"Bạn thắng "+nx.label.toLowerCase()+"!":"Bạn thua — xem tiếp các trận còn lại")}
    else tourBracket(esc(tourP(winId).name)+" thắng");
  };
  cur.onQuit=()=>{if(watch){cur.onEnd(Math.random()<.5?0:1)}else cur.onEnd(1)};
  const launch=()=>{M=cur;launchFight({pDef:dMe,pLv:1,eDef:dOpp,eLv:1,arena:pick(ARENA_IDS),label:nx.label,eName:opp.name,odN:watch?0:1,
    setup:g=>{if(watch){g.watch0=true;g.botOD0=rand(5,15);g.pODn=0}}});
    $("#fP .who b").textContent=watch?pA.name:"Bạn";$("#odBtn").style.display=watch?"none":"";
    $("#pips").innerHTML=`<span class="pip-t">${watch?"ĐANG XEM":nx.label}</span>`};
  launch();
}
/* — kết thúc giải — */
function tourFinish(){
  const T=TOUR;if(T.done)return;T.done=true;
  const f=T.final,th=T.third,first=f.w,second=f.w===f.a?f.b:f.a,third=th?th.w:null;
  const place=first===0?1:second===0?2:third===0?3:0;
  const mult=T.size===4?1:T.size===8?1.6:2.5;
  const rw=TOUR_REW[place]||{c:40,g:0},coins=Math.round(rw.c*mult*TUNEX.coin),gems=Math.round(rw.g*mult*TUNEX.gem);
  S.coins+=coins;S.gems+=gems;if(place===1)S.w++;save();updateWallet();
  const top=[first,second,third].filter(x=>x!==null).map(id=>({name:tourP(id).name,def:T.last[id]||pick(BALLS)}));
  const show=()=>{
    $("#layer").innerHTML=`<div class="overlay"><div class="sheet result ${place===1?"win":""}"><span class="idx">Giải bot ${T.size} người</span><h2>${place===1?"VÔ ĐỊCH":place?"HẠNG "+place:"KẾT THÚC GIẢI"}</h2>
      <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">${top.map((p,i)=>`<div class="stat" style="flex-direction:row;justify-content:space-between;flex-shrink:0"><span style="font-weight:800">${["🥇","🥈","🥉"][i]} ${esc(p.name)}</span><small class="idx">${p.def.name}</small></div>`).join("")}</div>
      <div class="rewards"><span class="chip-cur"><span class="coin"></span>+${fmt(coins)}</span>${gems?`<span class="chip-cur"><span class="gem"></span>+${gems}</span>`:""}</div>
      <div class="row-end" style="justify-content:center"><button class="btn btn-ghost mag" id="tHome">Về sảnh</button><button class="btn btn-main mag" id="tAgain">Giải mới ⟶</button></div></div></div>`;
    if(place===1){confettiBurst(innerWidth/2,innerHeight*.5,180,["#36E2FF","#FF4D7A","#FFC23D","#5CF2A8","#C3AEFF"]);flashbang("#FFC23D")}
    $("#tHome").onclick=()=>{TOUR=null;backToLobby()};$("#tAgain").onclick=()=>{sfx.click();tourSetup()};bindFx($("#layer"));
  };
  if(top.length>=3)playCeremony(top,show);else show();
}

/* ═════════════════════════ HỖN CHIẾN 8 BÓNG (chế độ giải trí) ═════════════════════════

   Người chơi chọn 1 con để cổ vũ (con đó dùng được nút Dồn lực) và đặt cược xu. */
const FFA_N=8,FFA_BETS=[0,100,300,1000],FFA_BASE=[0,150,80,50,25,20,15,10,10];
let FFA=null;
(function(){
  const rt=renderTab;
  renderTab=function(){rt();if(tab!=="play")return;const modes=document.querySelector(".modes");if(!modes||$("#goFFA"))return;
    modes.insertAdjacentHTML("beforeend",`<button class="mode tilt rv" id="goFFA" style="--mc:#FF4D7A;grid-column:1/-1"><span class="idx"><b>(VUI)</b> — Giải trí</span><h3>HỖN <em>CHIẾN</em></h3><p>8 quả bóng cùng lao vào một sàn, ai trụ lại cuối cùng thắng. Chọn 1 con để cổ vũ, đặt cược xu, giữ nút Dồn lực cho nó vào lúc gay cấn.</p><span class="m-go">⟶</span></button>`);
    $("#goFFA").onclick=()=>{sfx.click();ffaOpen()};bindFx(modes)};
})();
function ffaRoll(){const pool=BALLS.slice().sort(()=>Math.random()-.5);return pool.slice(0,FFA_N)}
function ffaOpen(keep){
  if(!keep||!FFA)FFA={defs:ffaRoll(),champ:0,bet:0};
  const F=FFA;if(F.bet>S.coins)F.bet=0;
  $("#layer").innerHTML=`<div class="overlay"><div class="draft">
    <div class="head"><div><span class="idx"><b>(HỖN CHIẾN)</b> — 8 bóng · ai trụ lại cuối thắng · tất cả Lv1</span><h2>CHỌN CON <em>CỔ VŨ</em></h2></div></div>
    <div class="picks" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${F.defs.map((b,i)=>`<button class="pick" data-r="${b.rar}" data-fc="${i}" style="${i===F.champ?"outline:2px solid var(--you);outline-offset:2px":""}">${orbHTML(b)}<div class="body"><h3>${b.name}</h3><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${rarPill(b.rar)}</div><p><b>${b.ab.name}.</b></p></div></button>`).join("")}</div>
    <div class="dfoot" style="flex-wrap:wrap;gap:10px"><span class="idx">Đặt cược:</span>${FFA_BETS.map(v=>`<button class="btn ${v===F.bet?"btn-main":"btn-ghost"} mag" data-fb="${v}" ${v>S.coins?"disabled":""}>${v?`<span class="coin"></span> ${fmt(v)}`:"Không cược"}</button>`).join("")}
      <span class="idx" style="flex-basis:100%">Hạng 1: nhận ×5 tiền cược · Hạng 2: ×2 · Hạng 3: hoàn tiền · thấp hơn: mất cược</span>
      <button class="btn btn-ghost mag" id="fRe">Đổi đội hình</button><button class="btn btn-ghost mag" id="fBack">Quay lại</button><button class="btn btn-main mag" id="fGo">Bắt đầu ⟶</button></div>
  </div></div>`;
  $$("[data-fc]").forEach(b=>b.onclick=()=>{F.champ=+b.dataset.fc;sfx.click();ffaOpen(true)});
  $$("[data-fb]").forEach(b=>b.onclick=()=>{F.bet=+b.dataset.fb;sfx.click();ffaOpen(true)});
  $("#fRe").onclick=()=>{sfx.whoosh();FFA=null;ffaOpen()};$("#fBack").onclick=()=>{closeLayer()};
  $("#fGo").onclick=()=>{sfx.click();ffaStart()};bindFx($("#layer"));
}
function ffaStart(){
  const F=FFA;S.coins-=F.bet;save();updateWallet();
  const defs=[F.defs[F.champ]].concat(F.defs.filter((_,i)=>i!==F.champ));F.order=defs;F.box0=BOX_EVERY;BOX_EVERY=5;
  M={mode:"ffa",round:1,score:[0,0],onEnd:ffaEnd,onQuit:()=>ffaEnd(-2)};
  closeLayer();
  launchFight({pDef:defs[0],pLv:1,eDef:defs[1],eLv:1,arena:pick(["neon","temple","void","desert","glacier","magma","pinball"]),label:"HỖN CHIẾN",eName:"Hỗn chiến",ot:60,setup:g=>{
    g.ffa=true;g.botOD=Infinity;g.elim=[];g.bxT=3;g.combo=Array.from({length:FFA_N},()=>({n:0,t:-9}));g.hurt=Array(FFA_N).fill(0);
    for(let i=2;i<FFA_N;i++){const m=makeBall(defs[i],1,i,W/2,H/2);g.mains.push(m);g.balls.push(m)}
    g.mains.forEach((m,k)=>{const a=k*TAU/FFA_N+.4;m.x=W/2+Math.cos(a)*215;m.y=H/2+Math.sin(a)*215;const to=Math.atan2(H/2-m.y,W/2-m.x)+rand(-.6,.6),s=m.base;m.vx=Math.cos(to)*s;m.vy=Math.sin(to)*s;m.mem.odT=rand(6,26);m.trail=[]});
    for(let i=2;i<FFA_N;i++){const m=g.mains[i];if(m.def.ab.init)m.def.ab.init(m)}
    g.hordeMax=g.mains.slice(1).reduce((a,m)=>a+m.max,0);
    g.koTxt=w=>w===0?"CON BẠN VÔ ĐỊCH":w>=0?(g.mains[w].def.name.toUpperCase()+" THẮNG"):"HOÀ";
  }});
  $("#pips").innerHTML=`<span class="pip-t">HỖN CHIẾN</span>`;$("#fB .who b").textContent="Hỗn chiến";
}
function ffaEnd(w){
  if(M.ended)return;M.ended=true;if(raf){cancelAnimationFrame(raf);raf=0}
  const F=FFA,g=G;BOX_EVERY=F.box0||10;
  // bảng xếp hạng: người thắng, rồi thứ tự bị loại ngược lại
  const rank=[];if(w>=0)rank.push(w);
  for(const m of g.mains)if(m.alive&&!rank.includes(m.side))rank.push(m.side);
  for(const m of g.mains)if(!m.alive&&!g.elim.includes(m.side)&&!rank.includes(m.side))rank.push(m.side);
  for(let i=g.elim.length-1;i>=0;i--)if(!rank.includes(g.elim[i]))rank.push(g.elim[i]);
  for(const m of g.mains)if(!rank.includes(m.side))rank.push(m.side);
  const place=w===-2?0:rank.indexOf(0)+1;
  const base=FFA_BASE[place]||0,mult=place===1?5:place===2?2:place===3?1:0,win=F.bet*mult;
  const coins=Math.round(base*TUNEX.coin)+win,gems=place===1?Math.round(3*TUNEX.gem):0;
  S.coins+=coins;S.gems+=gems;save();updateWallet();if(coins)sfx.coin();
  $("#match").hidden=true;auOn=true;
  $("#layer").innerHTML=`<div class="overlay"><div class="sheet result ${place===1?"win":""}" style="width:min(560px,100%);max-height:94vh;overflow:auto">
    <span class="idx">Hỗn chiến 8 bóng${F.bet?` · cược ${fmt(F.bet)} xu`:""}</span><h2>${w===-2?"BỎ CUỘC":place===1?"VÔ ĐỊCH":"HẠNG "+place}</h2>
    <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">${rank.map((sd,i)=>{const d=g.mains[sd].def,me=sd===0;return`<div style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:12px;flex-shrink:0;background:${me?"color-mix(in srgb,var(--you),transparent 85%)":"var(--panel)"};border:1px solid ${me?"var(--you)":"var(--line2)"}"><b style="width:26px;font-family:var(--font-display)">#${i+1}</b>${orbHTML(d,false,"").replace('class="orb','style="width:34px;height:34px" class="orb')}<span style="flex:1;font-weight:700">${d.name}${me?' <small style="color:var(--you)">(con bạn)</small>':""}</span><small class="idx">${RAR_VN[d.rar]}</small></div>`}).join("")}</div>
    <div class="rewards">${coins?`<span class="chip-cur"><span class="coin"></span>+${fmt(coins)}</span>`:""}${gems?`<span class="chip-cur"><span class="gem"></span>+${gems}</span>`:""}${!coins&&!gems?`<span style="color:var(--muted)">Mất cược</span>`:""}</div>
    <div class="row-end" style="justify-content:center"><button class="btn btn-ghost mag" id="fHome">Về sảnh</button><button class="btn btn-main mag" id="fAgain">Chơi lại ⟶</button></div></div></div>`;
  if(place===1){confettiBurst(innerWidth/2,innerHeight*.5,180,["#36E2FF","#FF4D7A","#FFC23D","#5CF2A8","#C3AEFF"]);flashbang("#FFC23D")}
  $("#fHome").onclick=()=>{backToLobby()};$("#fAgain").onclick=()=>{sfx.click();ffaOpen()};bindFx($("#layer"));
}

function stEnter(id,x,y,instant){

  ST.hero.x=x;ST.hero.y=y;ST.music=R.music;ST.title={txt:R.name,t:0};ST.fade=instant?1:1;ST.fadeTo=0;
  ST.npcs=(NPCS[id]||[]).filter(n=>!n.when||n.when(s)).map(n=>Object.assign({},n,{px:(n.x+.5)*TS,py:(n.y+.5)*TS}));

function tileAt(tx,ty){if(ty<0||ty>=ST.H||tx<0||tx>=ST.W)return"#";return ST.map[ty][tx]}
function solidAt(px,py){return SOLID.has(tileAt(Math.floor(px/TS),Math.floor(py/TS)))}
function blocked(x,y){const r=9;if(solidAt(x-r,y-r)||solidAt(x+r,y-r)||solidAt(x-r,y+r)||solidAt(x+r,y+r))return true;for(const n of ST.npcs)if(!n.item&&Math.hypot(n.px-x,n.py-y)<22)return true;return false}

/* ───────── VÒNG LẶP ───────── */
function stLoop(ts){
  if(!ST)return;ST.raf=requestAnimationFrame(stLoop);
  const dt=clamp((ts-ST.last)/1000||0,0,.05);ST.last=ts;ST.t+=dt;
  if(ST.fade!==ST.fadeTo)ST.fade=ST.fadeTo>ST.fade?Math.min(ST.fadeTo,ST.fade+dt*3):Math.max(ST.fadeTo,ST.fade-dt*3);
  if(ST.title)ST.title.t+=dt;
  if(ST.mode==="battle")batUpdate(dt);
  else{
    if(!ST.busy&&!ST.dlg)walkUpdate(dt);
    if(ST.dlg)dlgUpdate(dt);
  }
  for(const p of ST.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}ST.parts=ST.parts.filter(p=>p.t<p.life);
  ST.shake*=Math.pow(.02,dt);
  stRender();ST.pressed={};
}
function walkUpdate(dt){
  const h=ST.hero,k=ST.keys;let vx=(k.right?1:0)-(k.left?1:0),vy=(k.down?1:0)-(k.up?1:0);
  if(vx||vy){const l=Math.hypot(vx,vy);vx/=l;vy/=l;h.fx=vx;h.fy=vy;h.walk+=dt*10;const sp=118*dt;
    if(!blocked(h.x+vx*sp,h.y))h.x+=vx*sp;if(!blocked(h.x,h.y+vy*sp))h.y+=vy*sp;
    if(Math.random()<dt*6)ST.parts.push({x:h.x+rand(-4,4),y:h.y+10,vx:rand(-10,10),vy:rand(-20,-5),t:0,life:.4,c:"rgba(195,174,255,.5)",r:2})}
  const s=sv();
  for(const n of ST.npcs)if(n.item&&Math.hypot(n.px-h.x,n.py-h.y)<18){ST.npcs=ST.npcs.filter(o=>o!==n);s.flags[n.id]=true;if(n.item==="candy")s.flags[n.id]=true;s.items[n.item]=(s.items[n.item]||0)+1;sfx.coin();stRun(()=>say(null,`(Cậu nhặt được ${ITEM_NAME[n.item]}.)`));return}
  const tx=Math.floor(h.x/TS),ty=Math.floor(h.y/TS);
  for(const ex of RM[ST.room].exits)if(tx>=ex.x&&tx<ex.x+ex.w&&ty>=ex.y&&ty<ex.y+ex.h){stRun(async()=>{if(await gateCheck(ex))return;await fadeOut();stEnter(ex.to,ex.tx*TS,ex.ty*TS);await fadeIn()});return}
  for(const tr of TRIG[ST.room]||[])if(!s.flags[tr.id]&&tx>=tr.x&&tx<tr.x+tr.w&&ty>=tr.y&&ty<tr.y+tr.h){s.flags[tr.id]=true;stRun(tr.fn);return}
  if(ST.room==="rung"&&!s.flags.puzzle){const t2=tileAt(tx,ty);if(t2==="P"&&ST.lastPlate!==tx+","+ty){ST.lastPlate=tx+","+ty;plateStep(tx,ty)}else if(t2!=="P")ST.lastPlate=null}
  if(ST.pressed.a)interact();
  if(ST.pressed.b||ST.pressed.m)stMenu();
}
function interact(){
  const h=ST.hero,fx=h.x+h.fx*24,fy=h.y+h.fy*24;
  let best=null,bd=30;for(const n of ST.npcs){if(n.item)continue;const d=Math.hypot(n.px-fx,n.py-fy);if(d<bd){bd=d;best=n}}
  if(best){const fn=TALK[best.id];if(fn)stRun(()=>fn(best));return}
  const t=tileAt(Math.floor(fx/TS),Math.floor(fy/TS));
  if(t==="*")stRun(starSave);else if(t==="f")stRun(flowerTalk);else if(t==="M")stRun(muralTalk);else if(t==="T")stRun(()=>say(null,"(Một cái cây. Lá của nó là những mảnh giấy gói rương cũ.)"));else if(t==="~")stRun(()=>say(null,"(Nước gợn lên mùi nhựa mới. Đáy hồ lấp lánh như lớp nilon bọc rương.)"));
  else if(t==="|")stRun(()=>say(null,"(Song sắt lạnh ngắt. Phía trên kia có ánh sáng.)"));
  else if(TILE_ACT[t]){const tx=Math.floor(fx/TS),ty=Math.floor(fy/TS);stRun(()=>TILE_ACT[t](tx,ty))}
}

const wait=ms=>new Promise(r=>setTimeout(r,ms));

const SPK={pip:{def:"pip",name:"Pip",v:900},pebble:{def:"pebble",name:"Lão Sỏi",v:180},moss:{def:"moss",name:"Rêu",v:420},bubble:{def:"bubble",name:"Bé Bong",v:1100},coal:{def:"coal",name:"Than",v:240},clover:{def:"clover",name:"Cỏ Bốn Lá",v:700},warden:{def:"warden",name:"Cai Ngục",v:150},thorn:{def:"thorn",name:"Gai",v:520},echo:{def:"echo",name:"Vọng",v:640},voice:{name:"???",v:300}};

function dlgUpdate(dt){
  const d=ST.dlg;if(!d)return;const full=d.txt.length;
  if(d.n<full){const before=Math.floor(d.n);d.n=Math.min(full,d.n+dt*42);const now=Math.floor(d.n);if(now>before&&d.txt[now-1]&&d.txt[now-1].trim()&&now%2===0){const sp=SPK[d.who];tone(sp?sp.v:520,.04,"square",.018,0,0,0)}
    if(ST.pressed.a||ST.pressed.b){d.n=full}return}
  if(d.choice){if(ST.pressed.up){d.sel=(d.sel+d.choice.length-1)%d.choice.length;sfx.tick()}if(ST.pressed.down){d.sel=(d.sel+1)%d.choice.length;sfx.tick()}
    if(ST.pressed.a){const r=d.res,i=d.sel;ST.dlg=null;sfx.click();r(i)}return}
  if(ST.pressed.a){const r=d.res;ST.dlg=null;r()}
}

function batUpdate(dt){
  const b=ST.bat,s=sv(),P=ST.pressed;if(b.intro>0){b.intro-=dt;return}
  b.tn=Math.min(b.txt.length,b.tn+dt*48);
  if(b.dmgPop){b.dmgPop.t+=dt;if(b.dmgPop.t>1.1)b.dmgPop=null}
  if(b.state==="menu"){if(P.left){b.sel=(b.sel+3)%4;sfx.tick()}if(P.right){b.sel=(b.sel+1)%4;sfx.tick()}
    if(P.a){sfx.click();if(b.sel===0){b.state="fight";b.bar=0;b.barDir=1}else{b.state="sub";b.sub=0}}}
  else if(b.state==="sub"){const L=subList(b);if(P.up){b.sub=(b.sub+L.length-1)%L.length;sfx.tick()}if(P.down){b.sub=(b.sub+1)%L.length;sfx.tick()}if(P.b){b.state="menu";return}
    if(P.a&&L.length){sfx.click();doSub(b,b.sub)}}
  else if(b.state==="fight"){b.bar+=dt*1.1*b.barDir;if(b.bar>1){b.state="text";showLines(b,["Cậu vung người... trượt mất."],()=>enemyTurn(b));return}
    if(P.a){const acc=1-Math.abs(b.bar-.5)*2,dm=Math.max(1,Math.round(atk()*(.45+acc*1.1)));b.hp-=dm;b.dmgPop={v:dm,t:0};b.shake=10;sfx.hit(dm*2,acc>.9);
      if(b.hp<=0){b.hp=0;s.kills++;S.storyMem.killsEver++;const F=b.F;s.exp+=F.exp;let up=false;while(s.exp>=s.lv*25){s.exp-=s.lv*25;s.lv++;up=true}
        if(b.id==="warden"){b.state="text";showLines(b,["\"...Hah. Vậy là... cậu cũng giống chúng.\"","\"Đi đi... phía trên... không có gì tốt đẹp đâu...\"","Cai Ngục vỡ vụn thành bụi sắt.",`Cậu nhận được ${F.exp} EXP.${up?" LV của cậu tăng lên.":""}`],()=>batEnd("kill"));return}
        b.state="text";showLines(b,[`${F.name} vỡ vụn thành bụi.`,`Cậu nhận được ${F.exp} EXP.${up?" LV của cậu tăng lên.":""}`],()=>batEnd("kill"));return}
      b.state="text";showLines(b,[acc>.9?"Một cú va hoàn hảo!":"Cậu va vào "+b.F.name+"."],()=>enemyTurn(b))}}
  else if(b.state==="text"){if(P.a&&b.tn>=b.txt.length){const nx=b.lines.shift();if(nx!==undefined){b.txt="* "+nx;b.tn=0}else{const cb=b.after;b.after=null;cb&&cb()}}else if(P.a)b.tn=b.txt.length}
  else if(b.state==="bubble"){b.bt+=dt;if(b.bt>1.6||(P.a&&b.bt>.3)){b.bubble=null;startPattern(b)}}

function drawBullet(g,u,R){
  if(u.kind==="ring"){g.strokeStyle="#9ef0ff";g.lineWidth=5;g.beginPath();g.arc(u.x,u.y,u.r,u.gap+.5,u.gap-.5+TAU);g.stroke();return}
  if(u.kind==="bar"){g.fillStyle="#C9D1E2";g.fillRect(u.x-u.w/2,R.y,u.w,u.gy-u.gh/2-R.y);g.fillRect(u.x-u.w/2,u.gy+u.gh/2,u.w,R.y+R.h-(u.gy+u.gh/2));return}
  if(u.kind==="chain"){g.strokeStyle=u.live?"#E8EEFF":"rgba(255,80,110,.6)";g.lineWidth=u.live?6:2;g.setLineDash(u.live?[10,4]:[4,6]);g.beginPath();g.moveTo(u.x1,u.y1);g.lineTo(u.x2,u.y2);g.stroke();g.setLineDash([]);return}
  g.save();g.translate(u.x,u.y);g.fillStyle="#F5EFFF";
  if(u.shape==="spike"){g.fillStyle="#9AE070";g.beginPath();g.moveTo(0,9);g.lineTo(-5,-7);g.lineTo(5,-7);g.closePath();g.fill()}
  else if(u.shape==="spikeH"){g.fillStyle="#9AE070";const dir=u.vx>0?1:-1;g.beginPath();g.moveTo(9*dir,0);g.lineTo(-7*dir,-5);g.lineTo(-7*dir,5);g.closePath();g.fill()}
  else if(u.shape==="note"){g.fillStyle="#9ef0ff";g.beginPath();g.ellipse(0,2,6,4.5,-.4,0,TAU);g.fill();g.fillRect(4,-10,2,12)}
  else if(u.shape==="key"){g.rotate(Math.atan2(u.vy,u.vx));g.fillStyle="#FFD23D";g.beginPath();g.arc(-6,0,5,0,TAU);g.fill();g.fillRect(-2,-1.5,12,3);g.fillRect(6,1,2,4);g.fillRect(9,1,2,3)}
  else{g.beginPath();g.arc(0,0,u.r||6,0,TAU);g.fill()}
  g.restore();
}

    const i=await choice("Pip áp mặt vào tấm kính.",["Ra ngoài với ta","Ở lại cũng được"],"pip");
    if(i===0){await say("pip","Ra ngoài thì ta sẽ không còn được ngắm nữa...");await say("pip","...Nhưng cậu nhớ tên ta. Gọi ta lần nữa đi.");await say(null,"(Cậu gọi: \"Pip.\")");sfx.reveal("mythic");await say("pip","Hehe. Vậy là đủ rồi.");s.flags.pipOut=true;S.storyMem.pipFree=true}
    else{await say("pip","Thật hả? Cảm ơn cậu! Cậu là người đầu tiên hỏi ta muốn gì đấy.");await say("pip","...Nhưng nếu có ngày ta muốn ra, cậu sẽ quay lại chứ?")}}
  ST.cut={lid:0};sfx.ko();for(let i=0;i<50;i++){ST.cut.lid=i/50;await wait(30)}
  await say("voice","Trên cao, chữ \"DỒN LỰC!\" sáng rực như một vì sao.");
  await say("voice",`Và ${fmt(S.coins)} đồng xu vàng lấp lánh trên bầu trời. Tất cả để mua thêm những chiếc rương.`);
  ST.cut.hand=0;for(let i=0;i<70;i++){ST.cut.hand=i/70;await wait(30)}
  await say("voice","Bàn Tay thò xuống. Lần này, về phía cậu.");
  if(dark){await say("voice","Nó nhấc cậu lên. Nhẹ nhàng, như nhặt một món đồ.");await say("voice","Một hiện vật hỏng... nhưng đã biết đập vỡ tủ kính. Hiếm đấy.")}
  else{await say("voice","Rồi nó khựng lại.");await say("voice","Lần đầu tiên, Bàn Tay không nhấc ai lên cả.");await say("voice","Như thể ở phía trên kia, có ai đó vừa đọc được một cái tên.")}
  ST.cut={black:1};
  S.storyMem.finished2=(S.storyMem.finished2||0)+1;S.storyMem.lv2=s.lv;S.coins+=800;S.gems+=30;S.copies.pip=(S.copies.pip||0)+1;if(!S.owned.pip)S.owned.pip=1;save();updateWallet();
  if(BY_ID.pip&&!BY_ID.pip.ab.desc.includes("gọi tên"))BY_ID.pip.ab.desc+=dark?"":" Đã có người gọi tên cậu ấy.";
  await say(null,"(+800 xu · +30 Gems · Pip thêm 1 bản sao)");
  await say(null,"HẾT CHƯƠNG 2 — PHÒNG TRƯNG BÀY");
  await say(null,"Chương 3: Người Cầm Điều Khiển — sắp ra mắt.");
  s.done=true;storyClose();
}

TRACKS.gallery={bpm:76,play(s,bar,t){const P=[[64,67,71],[60,64,67],[62,65,69],[59,62,67]],ch=P[bar%4],st=60/76/4;
  if(s===0)INS.pad(t,ch.map(n=>n-12),st*16,.6);if(s%3===0)INS.pluck(t,[ch[0]+12,ch[1]+12,ch[2]+12,ch[1]+24,ch[2]+12,ch[0]+24][(s/3|0)%6],st*3,.55,"sine");if(s===0||s===8)INS.bass(t,ch[0]-24,st*7,.5,320)}};
